// ── HttpBridge 콜백 저장소 (MainActivity _deliver/_fail 프로토콜) ──
window._httpCallbacks={};
window.HttpBridge=window.HttpBridge||{};
window.HttpBridge._deliver=function(id){
  const cb=window._httpCallbacks[id];
  if(cb){
    // MainActivity.fetch(id)로 결과 문자열 가져오기
    const data=window.HttpBridge.fetch?window.HttpBridge.fetch(id):null;
    delete window._httpCallbacks[id];
    cb.resolve(data);
  }
};
window.HttpBridge._fail=function(id){
  const cb=window._httpCallbacks[id];
  if(cb){delete window._httpCallbacks[id];cb.reject(new Error('http fail'));}
};

async function nativeGet(url){
  // Android WebView: HttpBridge.get(url,callbackId) → _deliver/_fail 콜백
  if(window.HttpBridge&&window.HttpBridge.get){
    return new Promise((resolve,reject)=>{
      const id='r'+Date.now()+Math.random().toString(36).slice(2,6);
      window._httpCallbacks[id]={
        resolve:(data)=>{
          if(!data){reject(new Error('empty'));return;}
          try{resolve(JSON.parse(data));}
          catch(e){reject(new Error('parse fail'));}
        },
        reject
      };
      // 타임아웃 (10초)
      setTimeout(()=>{
        if(window._httpCallbacks[id]){
          delete window._httpCallbacks[id];
          reject(new Error('timeout'));
        }
      },10000);
      try{window.HttpBridge.get(url,id);}
      catch(e){delete window._httpCallbacks[id];reject(e);}
    });
  }
  // 브라우저 환경 (테스트용)
  return fetch(url,{headers:{'User-Agent':'Mozilla/5.0'}}).then(r=>r.json());
}

function upbitCall(method,...args){
  return new Promise((resolve,reject)=>{
    if(!window.UpbitBridge||!window.UpbitBridge[method]){reject(new Error('업비트 브릿지를 사용할 수 없습니다(웹뷰 환경 아님).'));return;}
    const id='u'+Date.now()+Math.random().toString(36).slice(2,6);
    window._upbitCallbacks[id]={resolve};
    setTimeout(()=>{if(window._upbitCallbacks[id]){delete window._upbitCallbacks[id];reject(new Error('요청 시간 초과'));}},15000);
    try{window.UpbitBridge[method](...args,id);}
    catch(e){delete window._upbitCallbacks[id];reject(e);}
  }).then(raw=>{
    let json;
    try{json=JSON.parse(raw);}catch(e){throw new Error('응답 파싱 실패');}
    if(json&&json.error)throw new Error(json.error.message||JSON.stringify(json.error));
    return json;
  });
}

function autoTagByName(name,isUs){
  const n=(name||'').toLowerCase();
  if(['인버스','곱버스','inverse','short'].some(k=>n.includes(k)))return['헤지'];
  const tags=[];
  if(['반도체','전자','디스플레이','자동차','조선','화학','배터리','이차전지','ai전','smr','원자력','전력인프라','방산','chip','semiconductor'].some(k=>n.includes(k)))tags.push('수출주');
  if(['은행','금융','통신','유통','소매','음식','식품','건설','부동산','헬스케어','엔터','미디어','k엔터'].some(k=>n.includes(k)))tags.push('내수주');
  if(['삼성','현대','포스코','s&p','sp500','kospi','top10','대형','voo','spy'].some(k=>n.includes(k)))tags.push('대형주');
  if(['소형','중소','스몰','small'].some(k=>n.includes(k)))tags.push('소형주');
  if(['바이오','헬스','biotech','joby','lunar','arkk','성장','신성장'].some(k=>n.includes(k)))tags.push('성장주');
  if(['배당','dividend','income','채권','bond','treasury','bnd','shy','tlt','국고채','우량회사채'].some(k=>n.includes(k)))tags.push('가치주');
  // 성장/가치 둘 다 없으면 기본값 적용 (해외=성장주 가정, 국내도 동일)
  if(!tags.some(t=>['성장주','가치주'].includes(t)))tags.push('성장주');
  return tags.length?tags:['성장주'];
}

function migratePortfolio(p){
  // v3.6 미만: 워치리스트를 6분류 대표종목으로 강제 교체
  if(!p.ver||parseFloat(p.ver)<4.0){
    p.holdings.watchlist=JSON.parse(JSON.stringify(INIT.holdings.watchlist));
  }
  const lists=[p.holdings.kr_stocks,p.holdings.kr_etfs,p.holdings.us,p.holdings.bonds,p.holdings.watchlist||[]];
  lists.forEach(list=>list.forEach(h=>{
    // 알려진 ID → 항상 정확한 태그로 강제 덮어씀 (구버전 태그 제거)
    if(TAG_MAP[h.id]){
      h.tags=TAG_MAP[h.id];
    }
    // 태그 없거나 6분류 아닌 값만 있으면 자동 분류
    else if(!h.tags||!h.tags.length||!h.tags.some(t=>VALID6.has(t))){
      h.tags=autoTagByName(h.name,!!(h.ticker&&!h.code));
    }
  }));
  // 버전 숫자 비교 (문자열 '4.10'<'4.9' 버그 방지)
  const vn=parseFloat(p.ver||'0');
  if(vn<3.2)updateToV32(p);
  if(vn<3.8)updateToV37(p);
  if(vn<4.0)updateToV39(p);
  if(vn<4.1)updateToV41(p);
  if(vn<4.2)updateToV42(p);
  // v4.6: 보유종목·스위칭을 최신 사진(8/28) 데이터로 완전 교체
  if(vn<4.6){
    p.holdings.kr_stocks=JSON.parse(JSON.stringify(INIT.holdings.kr_stocks));
    p.holdings.kr_etfs=JSON.parse(JSON.stringify(INIT.holdings.kr_etfs));
    p.holdings.us=JSON.parse(JSON.stringify(INIT.holdings.us));
    p.holdings.bonds=JSON.parse(JSON.stringify(INIT.holdings.bonds));
    p.holdings.gold=JSON.parse(JSON.stringify(INIT.holdings.gold));
    p.holdings.crypto=JSON.parse(JSON.stringify(INIT.holdings.crypto));
    p.exRate=INIT.exRate;
    p.lastUpdated=INIT.lastUpdated;
    p.switching=JSON.parse(JSON.stringify(INIT.switching));
  }
  // v4.7: 거래내역 원장 추가
  if(vn<4.7){
    if(!Array.isArray(p.txns))p.txns=[];
  }
  // v4.8: 채권을 원화환산 저장(avgKRW/curKRW) 대신 외화(USD) 원가로 저장 — 환율 변동 시 채권가가 왜곡되던 문제 수정
  if(vn<4.8){
    const ex=p.exRate||INIT.exRate;
    (p.holdings.bonds||[]).forEach(h=>{
      if(h.avg==null&&h.avgKRW!=null)h.avg=Math.round((h.avgKRW/ex)*100)/100;
      if(h.cur==null&&h.curKRW!=null)h.cur=Math.round((h.curKRW/ex)*100)/100;
      delete h.avgKRW;delete h.curKRW;
      h.usd=true;
    });
  }
  p.ver='4.9';
  return p;
}

function priceSpec(cat,h){
  if(cat==='bonds')return{avg:'avg',cur:'cur',ccy:'USD'};
  if(cat==='us'&&h.usd!==false)return{avg:'avg',cur:'cur',ccy:'USD'};

}

// ── 거래내역(매수/매도) 원장 ──
// 거래 1건을 보유종목에 반영하고 txns에 기록. sell 전량 청산 시 호출부에서 제거.
function applyTrade(h,cat,side,qty,price,fee,date){
  const pf=priceSpec(cat,h);
  qty=Math.max(0,qty);price=Math.max(0,price);fee=fee||0;
  let realized=0;
  if(side==='buy'){
    const oldQty=h.qty||0,oldAvg=h[pf.avg]||0,nq=oldQty+qty;
    h[pf.avg]=nq>0?(oldQty*oldAvg+qty*price+fee)/nq:price;
    h.qty=nq;
    if(h[pf.cur]!=null)h[pf.cur]=price;
  }else{
    qty=Math.min(qty,h.qty||0);
    realized=(price-(h[pf.avg]||0))*qty-fee;
    h.qty=(h.qty||0)-qty;
    if(h[pf.cur]!=null)h[pf.cur]=price;
  }
  const realizedKRW=side==='sell'?realized*(pf.ccy==='USD'?portfolio.exRate:1):0;
  const t={id:'x'+Date.now()+Math.random().toString(36).slice(2,6),
    date:date||today(),side,cat,name:h.name,qty,price,fee,ccy:pf.ccy,realizedKRW};
  portfolio.txns.push(t);
  return{t,realizedKRW,closed:(side==='sell'&&(h.qty||0)<=1e-9)};
}
function realizedPnl(){return portfolio.txns.filter(t=>t.side==='sell').reduce((s,t)=>s+(t.realizedKRW||0),0);}

// ── 리밸런싱 계산 ──
// 자산군별 현재가치·목표치·갭. 목표는 100%가 아니어도 정규화.
function rebalRows(){
  const c=calc(),t=portfolio.targets,sumT=Math.max(1,(t.kr+t.us+t.bonds+t.gold+t.crypto));
  const defs=[['kr','🇰🇷 국내주식',c.kr,T.teal],['us','🌏 해외주식',c.us,T.blue],['bonds','🏦 채권',c.bonds,T.green],['gold','🪙 금·광물',c.gold,T.amber],['crypto','₿ 코인',c.crypto,T.purple]];
  return defs.map(([k,name,ev,color])=>{
    const w=(t[k]||0)/sumT,tval=c.total*w;
    return{k,name,ev,color,tgt:t[k]||0,w,tval,diff:ev-tval,cur:c.total>0?ev/c.total*100:0};
  });
}
// 추가매수만으로 리밸런싱: 목표 대비 부족한(diff<0) 자산군에만 배분, 이미 목표 이상(초과)인 자산군은 이번 배분에서 완전히 제외
function newMoneyPlan(monthlyWon){
  const rows=rebalRows().filter(r=>r.w>0);
  const c=calc();
  const short=rows.filter(r=>r.diff<0); // 목표보다 부족한 자산군만 매수 대상
  const totalNeed=short.reduce((s,r)=>s-r.diff,0);
  const allocs=rows.map(r=>({k:r.k,name:r.name,color:r.color,gap:r.diff<0?-r.diff:0,amt:0}));
  // 이번 달 배분: 부족액 비례, 부족 총액이 월 적립보다 작으면 나머지는 "부족했던 자산군끼리" 목표 비중 비례로 추가 적립 (초과 자산군은 끝까지 제외)
  let M=monthlyWon;
  if(totalNeed>0){
    allocs.forEach(a=>{if(a.gap>0){a.amt=Math.min(a.gap,M*a.gap/totalNeed);}});
    const used=allocs.reduce((s,a)=>s+a.amt,0);M-=used;
  }
  const sumShortW=short.reduce((s,r)=>s+r.w,0);
  if(M>1&&sumShortW>0){
    short.forEach(r=>{const a=allocs.find(x=>x.k===r.k);if(a)a.amt+=M*(r.w/sumShortW);});
  }
  const Xstar=c.total+totalNeed; // 부족분을 모두 채웠을 때의 총자산(초과 자산군은 그대로 유지)
  return{Xstar,totalNeed,allocs,months:monthlyWon>0?Math.ceil(Math.max(0,totalNeed)/monthlyWon):0};
}

// ── 분류 자동 판정 ──
function classifyTags(name,sector,per,marketCap,type){
  const tags=[];
  const nm=(name||'').toLowerCase();
  const sc=(sector||'').toLowerCase();
  const txt=nm+' '+sc;
  const exportKW=['반도체','전자','디스플레이','자동차','조선','화학','배터리','이차전지','소프트웨어','통신장비','기계','철강','에너지','equipment','semiconductor','tech','chip'];
  const domKW=['은행','금융','통신','유통','소매','음식료','건설','부동산','의료','보험','pharmaceutical','healthcare','retail','bank'];
  const exportHit=exportKW.filter(k=>txt.includes(k)).length;
  const domHit=domKW.filter(k=>txt.includes(k)).length;
  // 수출/내수는 더 많이 매칭된 쪽만 (동점이면 수출주 우선)
  if(exportHit>0&&exportHit>=domHit)tags.push('수출주');
  else if(domHit>0)tags.push('내수주');
  // 시총 기반 대형/소형
  if(type==='kr'&&marketCap){const cap=typeof marketCap==='string'?parseInt(marketCap.replace(/[^0-9]/g,'')):marketCap;if(cap>=1e12)tags.push('대형주');else if(cap<5e11)tags.push('소형주');}
  else if(type==='us'&&marketCap){if(marketCap>=10e9)tags.push('대형주');else if(marketCap<2e9)tags.push('소형주');}
  // PER 기반 성장/가치
  const perNum=parseFloat(per);
  if(perNum>0&&perNum<15)tags.push('가치주');else if(!perNum||perNum>30)tags.push('성장주');
  return tags.length?tags:['성장주'];
}

// ── 계산 ──
function calc(){
  const EX=portfolio.exRate;
  const kr=[...portfolio.holdings.kr_stocks,...portfolio.holdings.kr_etfs].reduce((s,h)=>s+h.qty*h.cur,0);
  const us=portfolio.holdings.us.reduce((s,h)=>s+h.qty*h.cur*EX,0);
  const bn=portfolio.holdings.bonds.reduce((s,h)=>s+h.qty*h.cur*EX,0);
  const go=portfolio.holdings.gold.reduce((s,h)=>s+h.qty*h.cur,0);
  const cr=portfolio.holdings.crypto.reduce((s,h)=>s+h.qty*h.cur,0);
  const cost=[...portfolio.holdings.kr_stocks,...portfolio.holdings.kr_etfs].reduce((s,h)=>s+h.qty*h.avg,0)
    +portfolio.holdings.us.reduce((s,h)=>s+h.qty*h.avg*EX,0)
    +portfolio.holdings.bonds.reduce((s,h)=>s+h.qty*h.avg*EX,0)
    +portfolio.holdings.gold.reduce((s,h)=>s+h.qty*h.avg,0)
    +portfolio.holdings.crypto.reduce((s,h)=>s+h.qty*h.avg,0);
  const total=kr+us+bn+go+cr;
  return{kr,us,bonds:bn,gold:go,crypto:cr,total,cost,pnl:total-cost,pnlPct:cost>0?(total-cost)/cost*100:0};
}

function perJudge(price,eps,indPer){
  if(!eps||!indPer)return null;
  const per=price/eps,r=per/indPer;
  if(eps<0)return{label:'적자',color:T.blue,per:null};
  if(r<0.70)return{label:'🟢 저평가',color:T.green,per};
  if(r<0.85)return{label:'🟡 소폭저',color:T.amber,per};

  if(r<1.30)return{label:'🟠 소폭고',color:T.amber,per};
  return{label:'🔴 고평가',color:T.red,per};
}

// ── 스위칭 ──
function calcMA3Arr(data){
  const f=data.filter(d=>d.val!==null);
  return f.slice(2).map((d,i)=>({ym:d.ym,ma3:(d.val+f[i+1].val+f[i].val)/3,val:d.val}));
}
function getSignal(data){
  const ma=calcMA3Arr(data);if(ma.length<3)return'insufficient';
  const n=ma.length;
  const r1=ma[n-1].ma3>ma[n-2].ma3; // 최근 1개월 상승
  const r2=ma[n-2].ma3>ma[n-3].ma3; // 그 전월 상승
  if(r1&&r2)return'bull';      // 3개월 연속 상승 (MA3 2회 연속↑)
  if(r1)return'forming';       // 직전월만 상승 (형성 초기)
  return'bear';                // 하락
}
function overallSignal(){
  const r=getSignal(portfolio.switching.retail),i=getSignal(portfolio.switching.ism);
  if(r==='bull'&&i==='bull')return{s:'bull',label:'🟢 경기 강세',sub:'수출주·가치주·대형주 비중 확대',color:T.green};
  if(r==='insufficient'||i==='insufficient')return{s:'wait',label:'⏳ 데이터 부족',sub:'지표 데이터를 입력해주세요',color:T.text3};
  if(r==='bear'&&i==='bear')return{s:'bear',label:'🔴 경기 약세',sub:'내수주·성장주·소형주·채권·금 비중 확대',color:T.red};
  if(r==='forming'||i==='forming')return{s:'forming',label:'🔶 신호 형성 중',sub:'3개월 연속 상승 조건 미충족 — 현재 비중 유지',color:T.amber};
  // 한 지표는 강세, 다른 지표는 약세 → 혼조
  return{s:'mixed',label:'🔶 지표 혼조',sub:'두 지표가 엇갈림 — 현재 비중 유지, 추세 확인 후 가감',color:T.amber};
}

// 네이버 통합 종목검색 (여러 엔드포인트 폴백)
async function searchNaver(q){
  // 엔드포인트 1: front-api autoComplete
  const endpoints=[
    'https://m.stock.naver.com/front-api/search/autoComplete?query='+encodeURIComponent(q)+'&target=stock,index,etf',
    'https://ac.stock.naver.com/ac?q='+encodeURIComponent(q)+'&target=stock,index,etf&where=stock',
  ];
  for(const url of endpoints){
    try{
      const d=await nativeGet(url);
      // 다양한 응답 구조 대응
      let items=[];
      if(d&&d.result&&d.result.items)items=d.result.items;
      else if(d&&d.items)items=d.items;
      else if(d&&Array.isArray(d.result))items=d.result;
      else if(Array.isArray(d))items=d;
      else if(d&&d.result&&Array.isArray(d.result))items=d.result;
      if(!items.length)continue;
      const mapped=items.map(it=>{
        const code=it.code||it.symbolCode||it.cd||'';
        const nation=it.nationCode||it.nationType||it.nation||'';
        const typeName=it.typeName||it.stockExchangeName||it.categoryName||it.nm||'';
        const nm=it.name||it.korName||it.stockName||it.nm||'';
        const isKr=(/^\d{6}$/.test(code))||nation==='KOR'||/KOSPI|KOSDAQ|KONEX|코스피|코스닥/.test(typeName);
        return{
          code:code,
          ticker:isKr?null:(it.reutersCode||it.symbolCode||code),
          name:nm,
          market:typeName||(isKr?'KRX':'US'),
          type:isKr?'kr':'us'
        };
      }).filter(x=>x.name&&x.code);
      if(mapped.length)return mapped;
    }catch(e){continue;}
  }
  return [];
}

// 야후 검색 (해외 백업)
async function searchYahoo(q){
  try{
    const d=await nativeGet('https://query1.finance.yahoo.com/v1/finance/search?q='+encodeURIComponent(q)+'&quotesCount=8&newsCount=0&enableFuzzyQuery=false');
    if(!d||!d.quotes||!d.quotes.length)return[];
    return d.quotes.filter(x=>['EQUITY','ETF'].includes(x.quoteType)).slice(0,8)
      .map(x=>({ticker:x.symbol,code:x.symbol,name:x.shortname||x.longname||x.symbol,market:x.exchange||'US',type:'us'}));
  }catch(e){return[];}
}

// 업비트 코인 검색
async function searchCoin(q){
  try{
    const markets=await nativeGet('https://api.upbit.com/v1/market/all?isDetails=false');
    const qu=q.toUpperCase();
    return markets.filter(m=>m.market.startsWith('KRW-')&&(
      m.market.replace('KRW-','').includes(qu)||m.korean_name.includes(q)||m.english_name.toUpperCase().includes(qu)
    )).slice(0,6).map(m=>({code:m.market,name:m.korean_name+'('+m.english_name+')',market:'Upbit',type:'crypto'}));
  }catch(e){return[];}
}

async function doSearch(cat,q){
  clearTimeout(searchTimer);
  const el=document.getElementById('searchRes');
  if(!el||q.trim().length<1){if(el)el.innerHTML='';return;}
  el.innerHTML=`<div style="color:${T.text3};font-size:12px;padding:14px;text-align:center"><span class="spin">⟳</span> 검색 중...</div>`;
  searchTimer=setTimeout(async()=>{
    let results=[];
    try{
      if(cat==='alts'){
        const [coins,naver]=await Promise.all([searchCoin(q),searchNaver(q)]);
        results=[...coins,...naver.filter(x=>x.type==='kr')];
      }else if(cat==='us'||cat==='bonds'){
        const naver=await searchNaver(q);
        let us=naver.filter(x=>x.type==='us');
        if(us.length===0)us=await searchYahoo(q);
        results=us;
      }else if(cat==='kr'){
        const naver=await searchNaver(q);
        results=naver.filter(x=>x.type==='kr');
      }else{ // watch: 전체
        const [naver,coins]=await Promise.all([searchNaver(q),searchCoin(q)]);
        results=[...naver,...coins];
        if(naver.filter(x=>x.type==='us').length===0){
          const us=await searchYahoo(q);results=[...results,...us];
        }
      }
    }catch(e){}
    // 중복 제거
    const seen=new Set();
    results=results.filter(r=>{const k=r.code||r.ticker;if(!k||seen.has(k))return false;seen.add(k);return true;});
    searchResults=results;
    const resEl=document.getElementById('searchRes');
    if(!resEl)return;
    resEl.innerHTML=results.length===0
      ?`<div style="color:${T.text3};font-size:13px;padding:16px;text-align:center">검색 결과가 없습니다<br><span style="font-size:11px;color:${T.text3}">종목명·종목코드·티커로 검색하세요</span></div>`
      :results.map((r,i)=>`<div onclick="selectStock(${i})" class="tap" style="padding:11px 12px;border-radius:10px;background:${T.bg};border:1px solid ${T.border};margin-bottom:6px;display:flex;justify-content:space-between;align-items:center">
        <div style="min-width:0;flex:1">
          <div style="font-size:14px;font-weight:600;color:${T.text};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</div>
          <div style="font-size:11px;color:${T.text3};margin-top:1px">${r.code||r.ticker||''} · ${r.market||''}</div>
        </div>
        <span style="font-size:10px;padding:3px 9px;border-radius:20px;background:${r.type==='kr'?T.teal:r.type==='crypto'?T.amber:T.blue}22;color:${r.type==='kr'?T.teal:r.type==='crypto'?T.amber:T.blue};font-weight:700;flex-shrink:0;margin-left:8px">${r.type==='kr'?'국내':r.type==='crypto'?'코인':'해외'}</span>
      </div>`).join('');
  },350);
}

let selectedStockInfo={},selectStockSeq=0;

async function selectStock(idx){
  const r=searchResults[idx];if(!r)return;
  const seq=++selectStockSeq;
  // 동기 DOM 접근 (모달 열려있는 시점)
  const nameEl=document.getElementById('selName');
  const codeEl=document.getElementById('selCode');
  const formEl=document.getElementById('addForm');
  if(!nameEl||!codeEl||!formEl)return;
  codeEl.textContent=(r.code||r.ticker||'')+(r.market||r.exchange?(' · '+(r.market||r.exchange)):'');
  formEl.style.display='block';
  formEl.setAttribute('data-idx',idx);
  nameEl.textContent=r.name+' (조회중...)';
  const info=await fetchStockInfo(r.code,r.ticker,r.type);
  // 비동기 완료 후 — 모달 닫혔거나 다른 종목 선택됐으면 폐기
  if(seq!==selectStockSeq)return;
  const nameEl2=document.getElementById('selName');
  const avgEl=document.getElementById('addAvg');
  const tagEl=document.getElementById('autoTags');
  const formEl2=document.getElementById('addForm');
  if(!nameEl2)return; // 모달 닫힘
  selectedStockInfo=info;
  nameEl2.textContent=r.name;
  if(info.price&&avgEl&&!avgEl.value)avgEl.value=info.price;
  const tags=classifyTags(r.name,info.sector,info.per,info.marketCap,r.type);
  if(tagEl)tagEl.innerHTML='<span style="font-size:11px;color:'+T.text3+'">자동 분류: </span>'+renderTags(tags);
  if(formEl2)formEl2.setAttribute('data-tags',JSON.stringify(tags));
}

// ── 주식 스타일 비중 진단 (수출/내수, 가치/성장, 대형/소형) ──
function styleTiltCard(){
  const EX=portfolio.exRate;
  const rows=[];
  [...portfolio.holdings.kr_stocks,...portfolio.holdings.kr_etfs].forEach(h=>rows.push({h,ev:h.qty*h.cur}));
  portfolio.holdings.us.forEach(h=>rows.push({h,ev:h.qty*h.cur*EX}));
  const total=rows.reduce((s,r)=>s+r.ev,0);
  const axis=(a,b)=>{let A=0,B=0;rows.forEach(r=>{const t=r.h.tags||[];if(t.includes(a))A+=r.ev;if(t.includes(b))B+=r.ev;});const d=A+B;return{A,B,pa:d?A/d*100:null,pb:d?B/d*100:null};};
  const axes=[
    {a:'수출주',b:'내수주',bullFav:'a'},
    {a:'가치주',b:'성장주',bullFav:'a'},
    {a:'대형주',b:'소형주',bullFav:'a'},
  ];
  const k=regimeKey(overallSignal());
  const favSide=k==='bull'?'a':k==='bear'?'b':null;
  const hedge=rows.filter(r=>(r.h.tags||[]).includes('헤지')).reduce((s,r)=>s+r.ev,0);
  return `<div style="background:${T.card};border-radius:14px;border:1px solid ${T.border};margin-bottom:14px;padding:12px 16px">
    <div style="font-size:13px;font-weight:700;color:${T.text};margin-bottom:4px">🧭 주식 스타일 비중 진단</div>
    <div style="font-size:11px;color:${T.text3};margin-bottom:10px">${k==='bull'?'강세 신호 — 수출·가치·대형주 비중을 높이는 방향':k==='bear'?'약세 신호 — 내수·성장·소형주 비중을 높이는 방향':'중립 — 스타일 중립 유지'} (진단 대상 주식 평가액 ${won(total,true)})</div>
    ${axes.map(ax=>{const r=axis(ax.a,ax.b);if(r.pa==null)return'';const fav=favSide==='a'?ax.a:favSide==='b'?ax.b:null;
      const chip=(nm,p,side)=>`<div style="flex:1;text-align:center;padding:7px 4px;border-radius:8px;background:${fav===side?(k==='bull'?T.green:T.amber)+'1A':T.bg2}">
        <div style="font-size:11px;color:${fav===side?(k==='bull'?T.green:T.amber):T.text2};font-weight:700">${nm}${fav===side?' ▲':''}</div>
        <div class="mono" style="font-size:14px;color:${T.text};font-weight:700;margin-top:1px">${p.toFixed(0)}%</div></div>`;
      return `<div style="display:flex;gap:6px;margin-bottom:7px">${chip(ax.a,r.pa,'a')}<div style="align-self:center;color:${T.text3};font-size:11px">vs</div>${chip(ax.b,r.pb,'b')}</div>`;}).join('')}
    ${hedge>0?`<div style="font-size:11px;color:${T.text3};margin-top:2px">🛡 헤지(인버스) 비중: <span class="mono" style="color:${TAG_COLOR['헤지']}">${(hedge/total*100).toFixed(1)}%</span></div>`:''}
    <div style="font-size:10px;color:${T.text3};margin-top:8px;line-height:1.5">태그가 both/neither 인 종목은 양쪽 합에서 제외되므로 비중 합은 100%가 아닙니다.</div>
  </div>`;
}

  }
  return `<div style="background:${T.card};border-radius:14px;border:1px solid ${T.border};overflow:hidden;margin-bottom:8px">

// ── 보유종목 화면 텍스트 파싱 (v4.7: 미리보기·코인·신규추가·사라진종목 감지) ──
const COIN_KO={'비트코인':'BTC','이더리움':'ETH','솔라나':'SOL','테더':'USDT','보라':'BORA',
  '디센트럴랜드':'MANA','리플':'XRP','도지코인':'DOGE','비트코인캐시':'BCH','이더리움클래식':'ETC',
  '카르다노':'ADA','스텔라루멘':'XLM','에이다':'ADA','트론':'TRX','체인링크':'LINK','폴리곤':'MATIC'};
function normName(s){return(s||'').replace(/\(소수\)/g,'').replace(/소수$/,'').replace(/[\s·.,()\-_]/g,'').toLowerCase();}
function holdingKeys(e){
  const h=e.h,ks=[h.name,h.code,h.ticker,h.upbit&&h.upbit.split('-')[1]];
  if(e.cat==='crypto'){const sym=h.upbit&&h.upbit.split('-')[1];if(sym){ks.push(sym);for(const[ko,sy]of Object.entries(COIN_KO))if(sy===sym)ks.push(ko);}}
  return ks.filter(Boolean).map(normName);
}
function matchHoldingByName(pool,name){
  const nn=normName(name);if(!nn||nn.length<2)return null;
  let best=null,bLen=0;
  for(const e of pool){for(const k of holdingKeys(e)){
    if(k===nn||k.includes(nn)||nn.includes(k)){if(k.length>bLen){bLen=k.length;best=e;}}
  }}
  return best;
}
// 토큰 1개를 숫자로 (% 표시는 제외, '원' 접미사 허용)
function parseNumTok(t){if(!t||t.includes('%'))return null;const x=t.replace(/[,+\s]/g,'').replace(/원$/,'');return /^-?\d+(\.\d+)?$/.test(x)?parseFloat(x):null;}

// 알려진 현재가/평단/수량과 대조해 숫자 배열을 (수량,현재가,평균가)로 배치
function assignNums(row,nums){
  const e=row.entry,h=e?e.h:null,cat=e?e.cat:row.cat;
  const pf=h?priceSpec(cat,h):null;
  const kCur=h&&pf?h[pf.cur]:null,kAvg=h&&pf?h[pf.avg]:null,kQty=h?h.qty:null;
  const consider=cand=>{
    if(!(cand.qty>0))return 1e9;let s=0;
    if(kCur&&cand.cur>0)s+=Math.abs(Math.log(cand.cur/kCur));
    if(kAvg&&cand.avg>0)s+=Math.abs(Math.log(cand.kAvg?cand.avg/kAvg:cand.avg/(kAvg||1)));
    if(kQty&&cand.qty>0)s+=0.15*Math.abs(Math.log(cand.qty/kQty));
    // 잔여 숫자 중 qty*cur ≈ 평가금액이 있으면 신뢰도 가산
    const used=new Set([cand.i,cand.j,cand.k]);
    const ev=cand.cur*cand.qty;
    if(ev>0&&nums.some((n,ix)=>!used.has(ix)&&Math.abs(n-ev)/ev<0.02))s-=1.5;
    return s;
  };
  if(!h||kCur==null||kAvg==null){
    row.qty=nums[0];
    if(nums.length>=3){row.cur=nums[1];row.avg=nums[2];}
    else row.avg=nums[1];
    return;
  }
  let best=null,bs=1e9;
  for(let i=0;i<nums.length;i++)for(let j=i+1;j<nums.length;j++)for(let k=j+1;k<nums.length;k++){
    let s=consider({qty:nums[i],cur:nums[j],avg:nums[k],i,j,k});if(s<bs){bs=s;best={qty:nums[i],cur:nums[j],avg:nums[k]};}
    s=consider({qty:nums[i],avg:nums[j],cur:nums[k],i,j:k,k:j});if(s<bs){bs=s;best={qty:nums[i],cur:nums[k],avg:nums[j]};}
  }
  if(best&&bs<2.5){row.qty=best.qty;row.cur=best.cur;row.avg=best.avg;return;}
  // 2개 숫자: 수량 + (현재가/평균가 중 더 가까운 쪽)
  if(nums.length===2){
    const dC=kCur?Math.abs(Math.log(nums[1]/kCur)):1e9,dA=kAvg?Math.abs(Math.log(nums[1]/kAvg)):1e9;
    row.qty=nums[0];
    if(dC<dA)row.cur=nums[1];else row.avg=nums[1];
    return;
  }
  row.qty=nums[0];
  if(nums[1]!=null)row.cur=nums[1];
  if(nums[2]!=null)row.avg=nums[2];
}

function parseSnapshotText(raw){
  const pool=flatHoldings(false);
  const lines=raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const rows=[];
  for(const line of lines){
    const clean=line.replace(/,/g,'');
    const tokens=clean.split(/\s+/).filter(Boolean);
    const nums=tokens.map(parseNumTok);
    const numIdx=tokens.map((t,i)=>parseNumTok(t)!=null?i:-1).filter(i=>i>=0);
    const frac=/소수|나머지/.test(line);
    // 이름 없이 숫자로만 시작하는 라인 = 직전 종목 소수분
    const allNum=tokens.every(t=>parseNumTok(t)!=null);
    if(allNum){
      if(rows.length&&numIdx.length>=1)rows[rows.length-1].extraQty=(rows[rows.length-1].extraQty||0)+nums[numIdx[0]];
      continue;
    }
    // 첫 '순수 숫자 토큰' 위치에서 이름/숫자 분리 (뒤에 숫자가 2개 이상 있어야 함).
    // '1Q 은액티브'·'조선TOP10'처럼 문자가 섞인 토큰은 이름으로 간주한다.
    let split=-1;
    for(let k=0;k<tokens.length;k++){if(nums[k]!=null){const rest=nums.slice(k).filter(v=>v!=null);if(rest.length>=2){split=k;}break;}}
    if(split<0)continue;
    let name=tokens.slice(0,split).join(' ').replace(/\(소수\)/g,'').trim();
    const vals=nums.slice(split).filter(v=>v!=null);
    if(!name||vals.length<2)continue;
    if(frac&&rows.length){rows[rows.length-1].extraQty=(rows[rows.length-1].extraQty||0)+vals[0];continue;}
    const m=matchHoldingByName(pool,name);
    const row={raw:line,name:m?m.h.name:name,entry:m,action:m?'match':'new',
      qty:null,cur:null,avg:null,cat:m?m.cat:'kr',code:'',extraQty:0,resolved:false};
    assignNums(row,vals);
    // 같은 종목이 여러 줄(정수/소수)이면 머지
    if(m){const ex=rows.find(r=>r.entry===m);if(ex){ex.qty=(ex.qty||0)+(row.qty||0);if(row.cur)ex.cur=row.cur;if(row.avg)ex.avg=row.avg;continue;}}
    rows.push(row);
  }
  rows.forEach(r=>{if(r.extraQty)r.qty=(r.qty||0)+r.extraQty;delete r.extraQty;});
  // 본문에 등장한 자산군인데 매칭되지 않은 보유종목 = 전량 매도 가능성
  const seenCats=new Set(rows.filter(r=>r.action==='match').map(r=>r.cat));
  const missing=[];
  pool.forEach(e=>{if(seenCats.has(e.cat)&&!rows.find(r=>r.entry===e))missing.push({entry:e,action:'keep'});});
  return{rows,missing};
}

let importDraft=null,importSeq=0;
const CAT_OPTS=[['kr','국내 주식/ETF'],['us','해외 주식/ETF'],['bonds','채권'],['gold','금·광물'],['crypto','코인(업비트)']];

function parseHoldingsText(){
  const raw=document.getElementById('importText')?.value;
  if(!raw||!raw.trim()){alert('증권/코인 앱 화면을 복사한 텍스트를 붙여넣어주세요.');return;}
  importDraft=parseSnapshotText(raw);
  importSeq++;
  showImportPreview();
  resolveNewRows(importSeq);
}

async function resolveNewRows(seq){
  for(const r of importDraft.rows){
    if(r.action!=='new'||r.code)continue;
    try{
      const coins=await searchCoin(r.name);
      if(coins&&coins.length){r.cat='crypto';r.code=coins[0].code;r.resolved=true;}
      else{
        const nv=await searchNaver(r.name);
        const kr=nv.find(x=>x.type==='kr'),us=nv.find(x=>x.type==='us');
        if(kr){r.cat='kr';r.code=kr.code;r.resolved=true;r.krETF=/ETF|ETN|KODEX|TIGER|RISE|ACE|KBSTAR|HANARO|SOL|에프앤/i.test(r.name+' '+(kr.market||''));}
        else if(us){r.cat='us';r.code=us.ticker||us.code;r.resolved=true;}
        else{const y=await searchYahoo(r.name);if(y&&y.length){r.cat='us';r.code=y[0].ticker;r.resolved=true;}}
      }
    }catch(e){}
    if(seq===importSeq)showImportPreview();
  }
}

function showImportPreview(){

// 미리보기 input onchange 바인딩(값 직렬화는 적용 시점에 DOM에서 읽음)
function applyImport(){
  const d=importDraft;if(!d)return;
  let upd=0,added=0,sold=0,removed=0;const errs=[];
  d.rows.forEach((r,i)=>{
    if(r.action==='ignore')return;
    const q=parseFloat(document.getElementById('impQ'+i)?.value);
    const c=parseFloat(document.getElementById('impC'+i)?.value);
    const a=parseFloat(document.getElementById('impA'+i)?.value);
    const code=(document.getElementById('impCode'+i)?.value||r.code||'').trim().toUpperCase();
    if(r.action==='match'&&r.entry){
      const{h,cat}=r.entry,pf=priceSpec(cat,h);
      if(q>0)h.qty=q;
      if(c>0)h[pf.cur]=c;
      if(a>0)h[pf.avg]=a;
      upd++;
    }else if(r.action==='new'){
      const tags=autoTagByName(r.name,r.cat==='us');
      const id='m'+Date.now()+Math.random().toString(36).slice(2,5);
      if(!code&&r.cat!=='kr'&&r.cat!=='gold'){errs.push(r.name+'(코드/티커 미입력)');return;}
      if(r.cat==='crypto'){
        const upbit=code.startsWith('KRW-')?code:'KRW-'+code.replace(/^KRW-/,'');
        portfolio.holdings.crypto.push({id,name:r.name.split('(')[0].trim(),upbit,qty:q||0,avg:a||c||0,cur:c||a||0});
      }else if(r.cat==='us'){
        portfolio.holdings.us.push({id,name:r.name,ticker:code,qty:q||0,avg:a||c||0,cur:c||a||0,tags,usd:true});
      }else if(r.cat==='bonds'){
        portfolio.holdings.bonds.push({id,name:r.name,ticker:code,qty:q||0,avg:a||c||0,cur:c||a||0,tags:['가치주'],usd:true});
      }else if(r.cat==='gold'){
        const isETF=/ETF|ETN|KODEX|TIGER|RISE|ACE|KBSTAR|HANARO|SOL|금|은|구리/i.test(r.name);
        portfolio.holdings.gold.push({id,name:r.name,code:code||'',qty:q||0,avg:a||c||0,cur:c||a||0});
      }else{
        const isETF=/ETF|ETN|KODEX|TIGER|RISE|ACE|KBSTAR|HANARO|SOL/i.test(r.name);
        const obj={id,name:r.name,code:code||'',qty:q||0,avg:a||c||0,cur:c||a||0,tags};
        if(isETF)portfolio.holdings.kr_etfs.push(obj);else portfolio.holdings.kr_stocks.push(obj);
      }
      added++;
    }
  });
  d.missing.forEach(m=>{
    if(m.action==='keep')return;
    const{h,cat}=m.entry,pf=priceSpec(cat,h);
    if(m.action==='sell'&&(h.qty||0)>0){applyTrade(h,cat,'sell',h.qty,h[pf.cur]||h[pf.avg]||0,0,today());sold++;}
    removeHoldingEntry(cat,h);removed++;
  });
  portfolio.lastUpdated=today();
  save();closeModal();render();
  importDraft=null;
  alert('📥 반영 완료\n기존 갱신: '+upd+' · 신규 추가: '+added+(sold?('\n전량매도 기록: '+sold):'')+(removed?('\n목록 제거: '+removed):'')+(errs.length?('\n\n⚠ 코드 없이 추가 실패:\n'+errs.slice(0,5).join('\n')):''));
}

function doRestore(){
  const txt=document.getElementById('restoreText')?.value;
  if(!txt||!txt.trim()){alert('백업 JSON을 붙여넣으세요.');return;}
  let data;
  try{data=JSON.parse(txt);}catch(e){alert('JSON 형식이 아닙니다: '+e.message);return;}
  if(!data.holdings){alert('백업 데이터에 holdings 정보가 없습니다.');return;}

function tradePickChange(i){
  const e=window._tradePool&&window._tradePool[+i];
  if(!e)return;
  const pf=priceSpec(e.cat,e.h);
  const priceEl=document.getElementById('trPrice');
  if(priceEl)priceEl.value=e.h[pf.cur]||'';
  document.querySelectorAll('#trEstimate').forEach(()=>{});
}
function confirmTrade(cat,id,side){
  let entry=id?findEntry(id):null;
  if(!entry){
    const sel=document.getElementById('trPick');
    const e=sel?window._tradePool[+sel.value]:null;
    if(!e){alert('종목을 선택하세요.');return;}
    entry=e;cat=e.cat;
  }
  const {h}=entry;
  const qty=parseFloat(document.getElementById('trQty')?.value);
  const price=parseFloat(document.getElementById('trPrice')?.value);
  const fee=parseFloat(document.getElementById('trFee')?.value)||0;
  const date=document.getElementById('trDate')?.value||today();
  if(!(qty>0)){alert('수량을 입력하세요.');return;}
  if(!(price>0)){alert('체결단가를 입력하세요.');return;}
  if(side==='sell'&&qty>h.qty+1e-9){alert('보유 수량('+h.qty+')보다 많이 매도할 수 없습니다.');return;}
  const pf=priceSpec(cat,h);
  const res=applyTrade(h,cat,side,qty,price,fee,date);
  let msg=(side==='sell'?'매도':'매수')+' 반영 완료';
  if(side==='sell')msg+='\n실현손익: '+(res.realizedKRW>=0?'+':'')+won(res.realizedKRW,true)+'원';
  if(res.closed){removeHoldingEntry(cat,h);msg+='\n(전량 매도 — 보유 목록에서 제거됨)';}
  h[pf.cur]=price; // 청산 후 제거된 경우 무해
  save();closeModal();
  if(cat==='crypto'||cat==='gold')catH='alts';else if(cat==='kr'||cat==='us'||cat==='bonds')catH=cat;
  render();
  setTimeout(()=>alert(msg),50);
}

function addSwitchMonth(key){
  const data=portfolio.switching[key];
  if(!data||!data.length)return;
  const last=data[data.length-1].ym;
  const [y,m]=last.split('-').map(Number);
  const nm=m===12?1:m+1,ny=m===12?y+1:y;
  const nYm=ny+'-'+(nm<10?'0':'')+nm;
  if(!data.find(d=>d.ym===nYm))data.push({ym:nYm,val:null});
  Store.set('porto',JSON.stringify(portfolio));render();
}

    alert('✅ 연결 성공\nKRW 잔고: '+(krw?won(+krw.balance,true):'0')+'원\n보유 자산 '+(accs?accs.length:0)+'종');

}

  window._ubOrder={id,side:'bid',type:'limit'};
  showModal(ubOrderHtml());
  setTimeout(()=>document.getElementById('ubQty')?.focus(),300);
}
function ubOrderHtml(){
  const st=window._ubOrder;
  const entry=findEntry(st.id);
  const h=entry.h;
  const isSell=st.side==='ask';
  const isMkt=st.type!=='limit';
  const lastOrder=window._ubLastOrder&&window._ubLastOrder.id===st.id?window._ubLastOrder:null;
  return `<div class="sheet-handle"></div>
    <div style="font-size:16px;font-weight:700;color:${T.amber};margin-bottom:4px">⚡ 업비트 실거래 주문</div>

    ${lastOrder?`<div style="background:${T.bg2};border-radius:10px;padding:10px 12px;margin-bottom:12px">
      <div style="font-size:12px;color:${T.text2};margin-bottom:8px">최근 주문 UUID: ${lastOrder.uuid.slice(0,13)}...</div>
      <button onclick="checkUpbitFill()" class="tap" style="width:100%;padding:9px;background:${T.blue}22;color:${T.blue};border-radius:8px;font-size:12px;font-weight:700">체결 상태 확인 → 포트폴리오 반영</button>
    </div>`:''}
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <button onclick="ubSetSide('bid')" class="tap" style="flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:700;background:${!isSell?T.green:T.bg3};color:${!isSell?'#fff':T.text2}">매수</button>
      <button onclick="ubSetSide('ask')" class="tap" style="flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:700;background:${isSell?T.red:T.bg3};color:${isSell?'#fff':T.text2}">매도</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button onclick="ubSetType('limit')" class="tap" style="flex:1;padding:8px;border-radius:10px;font-size:12px;font-weight:700;background:${!isMkt?T.blue:T.bg3};color:${!isMkt?'#fff':T.text2}">지정가</button>
      <button onclick="ubSetType('market')" class="tap" style="flex:1;padding:8px;border-radius:10px;font-size:12px;font-weight:700;background:${isMkt?T.blue:T.bg3};color:${isMkt?'#fff':T.text2}">시장가</button>

        <div><div style="font-size:12px;color:${T.text3};margin-bottom:5px">가격 (KRW)</div><input type="number" id="ubPrice" placeholder="0" step="any" value="${h.cur||''}"></div>`

function ubSetSide(s){window._ubOrder.side=s;showModal(ubOrderHtml());}
function ubSetType(t){window._ubOrder.type=t;showModal(ubOrderHtml());}
async function confirmUpbitOrder(){
  const st=window._ubOrder;
  const entry=findEntry(st.id);
  const h=entry.h,market=h.upbit,side=st.side,isMkt=st.type!=='limit';
  let volume=null,price=null,ordType;
  if(!isMkt){
    volume=parseFloat(document.getElementById('ubQty')?.value);
    price=parseFloat(document.getElementById('ubPrice')?.value);
    if(!(volume>0)){alert('수량을 입력하세요.');return;}
    if(!(price>0)){alert('가격을 입력하세요.');return;}
    ordType='limit';
  }else if(side==='ask'){
    volume=parseFloat(document.getElementById('ubQty')?.value);
    if(!(volume>0)){alert('수량을 입력하세요.');return;}
    if(volume>h.qty+1e-9){alert('보유 수량('+h.qty+')보다 많이 매도할 수 없습니다.');return;}
    ordType='market';
  }else{
    price=parseFloat(document.getElementById('ubAmount')?.value);
    if(!(price>0)){alert('매수 금액을 입력하세요.');return;}
    ordType='price';
  }
  if(!confirm((side==='ask'?'매도':'매수')+' 주문을 업비트 실계좌에 전송합니다. 계속할까요?'))return;
  try{
    const res=await upbitPlaceOrder(market,side,volume!=null?String(volume):'',price!=null?String(price):'',ordType);
    window._ubLastOrder={uuid:res.uuid,id:st.id,side};
    closeModal();
    setTimeout(()=>alert('✅ 주문 접수됨\n상태: '+res.state+'\nUUID: '+res.uuid+'\n\n⚡ 버튼을 다시 눌러 체결 상태를 확인하세요.'),50);
  }catch(e){
    alert('❌ 주문 실패: '+e.message);
  }
}
async function checkUpbitFill(){
  const last=window._ubLastOrder;
  if(!last)return;
  try{
    const o=await upbitOrderStatus(last.uuid);
    const trades=o.trades||[];
    let totalFunds=0,totalVol=0;
    trades.forEach(t=>{totalFunds+=parseFloat(t.funds||0);totalVol+=parseFloat(t.volume||0);});
    const executedVolume=totalVol||parseFloat(o.executed_volume||0);
    if(!(executedVolume>0)){alert('아직 체결되지 않았습니다.\n상태: '+o.state);return;}
    const entry=findEntry(last.id);
    if(!entry){alert('종목을 찾을 수 없습니다.');return;}
    const avgPrice=totalFunds>0?totalFunds/executedVolume:parseFloat(o.price||entry.h.cur||0);
    const fee=parseFloat(o.paid_fee||0);
    const sideWord=last.side==='ask'?'sell':'buy';
    if(!confirm('체결 수량 '+executedVolume+'개 @ '+won(avgPrice)+'원을 포트폴리오에 반영할까요?'))return;
    const res=applyTrade(entry.h,'crypto',sideWord,executedVolume,avgPrice,fee,today());
    if(res.closed)removeHoldingEntry('crypto',entry.h);
    else entry.h.cur=avgPrice;
    save();
    window._ubLastOrder=null;
    closeModal();
    render();
    let msg='✅ 포트폴리오 반영 완료';
    if(sideWord==='sell')msg+='\n실현손익: '+(res.realizedKRW>=0?'+':'')+won(res.realizedKRW,true)+'원';
    setTimeout(()=>alert(msg),50);
  }catch(e){alert('조회 실패: '+e.message);}
}

function showSwitchUpdateModal(){
  const now=new Date();
  // 소매판매는 전전월 데이터가 당월 발표 (예: 6월에 4월치 발표)
  const retailLag=new Date(now.getFullYear(),now.getMonth()-2,1);
  const ismLag=new Date(now.getFullYear(),now.getMonth()-1,1);
  const fmtYM=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  const rYM=fmtYM(retailLag),iYM=fmtYM(ismLag);
  const rLast=portfolio.switching.retail.filter(d=>d.val!==null).slice(-1)[0];
  const iLast=portfolio.switching.ism.filter(d=>d.val!==null).slice(-1)[0];
  showModal(`<div class="sheet-handle"></div>
    <div style="font-size:16px;font-weight:700;color:${T.text};margin-bottom:4px">📊 지표 업데이트</div>
    <div style="font-size:12px;color:${T.text3};margin-bottom:18px">최신 발표 데이터를 입력하세요</div>
    <div style="background:${T.bg2};border-radius:12px;padding:14px;margin-bottom:12px">
      <div style="font-size:13px;font-weight:700;color:${T.teal};margin-bottom:10px">🛍 미국 소매판매 YoY (%)</div>
      <div style="font-size:11px;color:${T.text3};margin-bottom:8px">
        입력 월: <span style="color:${T.text}">${rYM}</span>
        ${rLast?` · 직전값: <span style="color:${T.amber}">${rLast.val}% (${rLast.ym})</span>`:''}
      </div>
      <input type="number" id="retailInput" placeholder="예: 4.9" step="0.1"
        style="font-size:18px;text-align:center;font-family:monospace">
    </div>
    <div style="background:${T.bg2};border-radius:12px;padding:14px;margin-bottom:18px">
      <div style="font-size:13px;font-weight:700;color:${T.blue};margin-bottom:10px">🏭 ISM 제조업 가격지수 (pt)</div>
      <div style="font-size:11px;color:${T.text3};margin-bottom:8px">
        입력 월: <span style="color:${T.text}">${iYM}</span>
        ${iLast?` · 직전값: <span style="color:${T.amber}">${iLast.val}pt (${iLast.ym})</span>`:''}
      </div>
      <input type="number" id="ismInput" placeholder="예: 82.1" step="0.1"
        style="font-size:18px;text-align:center;font-family:monospace">
    </div>
    <div style="display:flex;gap:10px">
      <button onclick="saveSwitchUpdate('${rYM}','${iYM}')" class="tap"
        style="flex:1;padding:14px;background:${T.teal};color:#000;border-radius:12px;font-size:15px;font-weight:700">저장</button>
      <button onclick="closeModal()" class="tap"
        style="flex:1;padding:14px;background:${T.bg3};color:${T.text2};border-radius:12px;font-size:14px">취소</button>
    </div>`);
  setTimeout(()=>document.getElementById('retailInput')?.focus(),300);
}

function saveSwitchUpdate(rYM,iYM){
  const rv=document.getElementById('retailInput')?.value;
  const iv=document.getElementById('ismInput')?.value;
  let saved=0;
  if(rv!==''&&rv!=null){
    const rVal=parseFloat(rv);
    if(!isNaN(rVal)){
      const idx=portfolio.switching.retail.findIndex(d=>d.ym===rYM);
      if(idx>=0)portfolio.switching.retail[idx].val=rVal;
      else portfolio.switching.retail.push({ym:rYM,val:rVal});
      portfolio.switching.retail.sort((a,b)=>a.ym.localeCompare(b.ym));
      saved++;
    }
  }
  if(iv!==''&&iv!=null){
    const iVal=parseFloat(iv);
    if(!isNaN(iVal)){
      const idx=portfolio.switching.ism.findIndex(d=>d.ym===iYM);
      if(idx>=0)portfolio.switching.ism[idx].val=iVal;
      else portfolio.switching.ism.push({ym:iYM,val:iVal});
      portfolio.switching.ism.sort((a,b)=>a.ym.localeCompare(b.ym));
      saved++;
    }
  }
  if(saved>0){
    Store.set('porto',JSON.stringify(portfolio));
    closeModal();
    tab='switching';
    render();
  }else{
    alert('값을 입력해주세요.');
  }
}

// ── 모달 ──
function showModal(c){document.getElementById('modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">${c}</div></div>`;}
function closeModal(){document.getElementById('modal-root').innerHTML='';}

// ── 스와이프 (종목 탭 좌우) ──
document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  if(tab!=='holdings')return;
  const dx=e.changedTouches[0].clientX-touchStartX,dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5)return;
  const cats=['kr','us','bonds','alts','watch'],idx=cats.indexOf(catH);
  if(dx<0&&idx<cats.length-1){catH=cats[idx+1];render();}
  else if(dx>0&&idx>0){catH=cats[idx-1];render();}
},{passive:true});

// ── 메인 렌더 ──
const TABS=[{id:'home',ic:'◎',l:'홈'},{id:'holdings',ic:'≡',l:'종목'},{id:'switching',ic:'⇄',l:'스위칭'},{id:'rebal',ic:'⊖',l:'리밸런싱'},{id:'analysis',ic:'↗',l:'분석'},{id:'settings',ic:'◈',l:'설정'}];

function render(){
  let content='';

  else if(tab==='holdings')content=holdingsScreen();
  else if(tab==='switching')content=switchingScreen();
  else if(tab==='rebal')content=rebalScreen();

  document.getElementById('app').innerHTML=`<div style="width:100%;height:100vh;display:flex;flex-direction:column;background:${T.bg};overflow:hidden;position:relative">

      <span style="font-size:15px;font-weight:800;color:${T.text}">📊 포트폴리오</span>
      <div style="display:flex;gap:8px;align-items:center">${loadingPrice?`<span class="pulse" style="font-size:10px;color:${T.teal}">● LIVE</span>`:''}<span class="mono" style="font-size:11px;color:${T.text3}">${portfolio.lastUpdated}</span></div>
    </div>
    ${logs.length?`<div style="position:absolute;top:58px;left:10px;right:10px;z-index:150;background:${T.bg3}EE;border:1px solid ${T.border};border-radius:12px;padding:10px 14px">${logs.map(m=>`<div style="font-size:11px;color:${m.startsWith('✅')?T.green:T.text2};font-family:monospace;margin-bottom:2px">${m}</div>`).join('')}</div>`:''}
    <div style="flex:1;overflow:hidden;position:relative">${content}</div>
    <div style="height:62px;background:${T.bg2};border-top:1px solid ${T.border};display:flex;flex-shrink:0">
      ${TABS.map(t=>`<button onclick="tab='${t.id}';render()" class="tap" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:transparent;color:${tab===t.id?T.teal:T.text3};position:relative;padding:4px 0"><span style="font-size:18px">${t.ic}</span><span style="font-size:9px;font-weight:${tab===t.id?700:400}">${t.l}</span>${tab===t.id?`<div style="position:absolute;bottom:0;width:24px;height:2px;background:${T.teal};border-radius:1px"></div>`:''}</button>`).join('')}
    </div>
  </div>`;
  // 리밸런싱: 배분 가이드는 DOM 주입(슬라이더 oninput과 공유)
  if(tab==='rebal')renderAllocCards();
}

render();
</script>
