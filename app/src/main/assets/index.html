<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>포트폴리오 v4.6</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#04080F;overflow:hidden;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
.mono{font-family:'Menlo','Consolas',monospace}
::-webkit-scrollbar{display:none}
input[type=range]{-webkit-appearance:none;height:5px;border-radius:3px;outline:none;cursor:pointer;width:100%;background:#1A2845}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#00BFA6;box-shadow:0 0 8px #00BFA644}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.fade{animation:fadeIn .25s ease forwards}
.spin{display:inline-block;animation:spin .7s linear infinite}
.pulse{animation:pulse 1.5s infinite}
.scr{overflow-y:auto;-webkit-overflow-scrolling:touch}
input[type=text],input[type=number]{background:#0C1524;border:1px solid #172033;border-radius:10px;color:#ECF1FF;padding:10px 12px;font-size:14px;outline:none;width:100%}
