plugins {
    id 'com.android.application'
}
android {
    namespace 'com.portfolio.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.portfolio.app"
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "5.1"
        // 런처 아이콘 아래 앱 이름에 버전을 직접 노출 → 앱을 열지 않고도 설치된 빌드 확인 가능
        manifestPlaceholders = [appLabel: "포트폴리오 v${versionName}"]
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // 서버릿(keystore) 환경변수가 있으면 정식 서명, 없으면 디버그 키로 서명(설치는 가능)
            def ksPath = System.getenv("KEYSTORE_PATH")
            if (ksPath && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}
