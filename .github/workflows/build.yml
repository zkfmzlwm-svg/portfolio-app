name: Build Portfolio APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 주의: 2026-09부터 구글 저장소에서 'tools' 패키지가 삭제되어 포함하면 실패함
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Decode keystore (only if secret exists)
        run: |
          if [ -n "${KEYSTORE_B64}" ]; then
            printf '%s' "${KEYSTORE_B64}" | base64 -d > release.jks
          else
            echo "KEYSTORE_BASE64 미설정 — debug 키로 서명합니다."
          fi
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease assembleDebug --no-daemon --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
